<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!--
    A player who cashed out, drifting down under a canopy.

    Drawn with its canopy at the top and the figure hanging below, anchored so
    the stage can place it by the canopy and let the body swing beneath. The
    palette is the lobby's fire ramp rather than a generic parachute, so a screen
    full of them still reads as this game.
  -->
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8360f"/>
      <stop offset="0.28" stop-color="#ff8a2b"/>
      <stop offset="0.52" stop-color="#ffd27a"/>
      <stop offset="0.76" stop-color="#ff7420"/>
      <stop offset="1" stop-color="#a82c0c"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#1d1410"/>
    </linearGradient>
  </defs>

  <!-- Canopy: a dome with scalloped hem. -->
  <path d="M6 56 A54 50 0 0 1 114 56 L98 62 L86 52 L72 64 L60 52 L48 64 L34 52 L22 62 Z"
        fill="url(#canopy)"/>
  <!-- Seam shading, so the dome is not a flat arc. -->
  <g stroke="#7d2408" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M60 8 L60 56"/>
    <path d="M34 12 L36 55"/>
    <path d="M86 12 L84 55"/>
  </g>

  <!-- Rigging. -->
  <g stroke="#e6d3b4" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M22 62 L54 96"/>
    <path d="M48 64 L56 96"/>
    <path d="M72 64 L64 96"/>
    <path d="M98 62 L66 96"/>
  </g>

  <!-- Harness, body, head. -->
  <rect x="52" y="94" width="16" height="6" rx="3" fill="#5a4636"/>
  <path d="M52 100 h16 v22 a8 8 0 0 1 -16 0 Z" fill="url(#suit)"/>
  <circle cx="60" cy="88" r="9" fill="#f2c9a0"/>
  <path d="M51 86 a9 9 0 0 1 18 0 Z" fill="#c0392b"/>

  <!-- Legs, kicked forward the way a canopy ride actually hangs. -->
  <g stroke="#1d1410" stroke-width="6" stroke-linecap="round">
    <path d="M55 122 L48 138"/>
    <path d="M65 122 L72 138"/>
  </g>
  <!-- Arms up on the toggles. -->
  <g stroke="#f2c9a0" stroke-width="5" stroke-linecap="round">
    <path d="M53 104 L44 94"/>
    <path d="M67 104 L76 94"/>
  </g>
</svg>
