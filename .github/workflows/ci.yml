name: CI Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    # The e2e suite starts the real app, which needs a broker for its queue. The
    # unit and integration suites do not: they assert that an absent Redis degrades
    # a route rather than the graph, so they must keep running without one.
    services:
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      # Both apps. `@dunx/transform` reads constructor parameter types from source,
      # so a type that erases is a boot error rather than a runtime `undefined` -
      # which makes this gate load-bearing rather than cosmetic.
      - name: Typecheck
        run: bun run typecheck

      # `bun run test`, not `bun test`: the latter invokes Bun's own runner at the
      # workspace root, which has neither app's `[test]` config and picks up a
      # different file set. The script fans out to each workspace instead.
      - name: Test
        run: bun run test

      - name: E2E
        run: |
          cp apps/be/e2e/.env.example apps/be/e2e/.env
          bun run test:e2e
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build
        run: bun run build
