# The deployed shape: the tunnel, Redis, and the API - which serves the built
# client, holds the clock and consumes its own queues.
#
# `docker compose -f docker-compose.prod.yml up -d --build`
#
# ## One app container, and it used to be two
#
# `app-worker` and `WORKER_MODE: separate` are gone. `consume: true` opens the workers
# inside the running container, and the queues that must not share its event loop -
# email and image resizing - are `background`, so bullmq forks `src/jobs.processor.ts`
# per burst. Isolation is per handler now, and one fewer thing to deploy.
#
# **`app` still cannot be scaled past one replica.** The crash engine's tick loop must
# run in exactly one process, and the schedules are single-node for the same reason.
#
# pm2 is gone. Docker restarts these, and a process manager inside a container that
# already has one is two supervisors disagreeing about who owns the process.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app

  app-redis:
    image: public.ecr.aws/docker/library/redis:8.4.0
    container_name: app-redis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis-data:/data
    command: >
      sh -c "
      if [ -n \"$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $REDIS_PASSWORD
      else
        redis-server
      fi
      "
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a $REDIS_PASSWORD ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  app:
    container_name: app
    restart: unless-stopped
    build:
      # The workspace root, because the lockfile and the workspace list are there.
      context: .
      dockerfile: apps/be/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
        COMMIT_MESSAGE: ${COMMIT_MESSAGE:-}
    env_file:
      - .env
    environment:
      # On SIGTERM, keep answering while readiness reports 503 for six seconds, then
      # close the socket - `Readiness` implements `OnBeforeShutdown`, which runs before
      # `server.stop()`. Nothing here polls readiness to decide routing, so the value
      # is modest; it is set at all because a shape only configured in production is a
      # shape nobody has run.
      HEALTH_DRAIN_DELAY_MS: 6000
    # The drain plus teardown. Explicit next to the number it depends on, because
    # Docker's 10s default would not survive raising it.
    stop_grace_period: 20s
    ports:
      - '${COMPOSE_API_PORT:-3001}:3001'
    volumes:
      - app-data:/app/data
    depends_on:
      app-redis:
        condition: service_healthy
    networks:
      - app

volumes:
  redis-data:
  app-data:

networks:
  app:
    name: app-network
    driver: bridge
