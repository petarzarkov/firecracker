# The deployed shape: the tunnel, Redis, and the API - which serves the built
# client, holds the clock and consumes its own queues.
#
# `docker compose -f docker-compose.prod.yml up -d --build`
#
# ## One app container, and it used to be two
#
# `app-worker` and `WORKER_MODE: separate` are gone. `consume: true` opens the workers
# inside the running container, and the queues that must not share its event loop -
# email and image resizing - are `background`, so bullmq forks `src/jobs.processor.ts`
# per burst. Isolation is per handler now, and one fewer thing to deploy.
#
# **`app` still cannot be scaled past one replica.** The crash engine's tick loop must
# run in exactly one process, and the schedules are single-node for the same reason.
#
# pm2 is gone. Docker restarts these, and a process manager inside a container that
# already has one is two supervisors disagreeing about who owns the process.
x-logging:
  &logging # The json-file default has no cap, and this process logs per round forever.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    logging: *logging
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app

  app-redis:
    image: public.ecr.aws/docker/library/redis:8.4.0
    logging: *logging
    container_name: app-redis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis-data:/data
    command: >
      sh -c "
      if [ -n \"$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $REDIS_PASSWORD
      else
        redis-server
      fi
      "
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a $REDIS_PASSWORD ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  app:
    container_name: app
    logging: *logging
    restart: unless-stopped
    build:
      # The workspace root, because the lockfile and the workspace list are there.
      context: .
      dockerfile: apps/be/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
        COMMIT_MESSAGE: ${COMMIT_MESSAGE:-}
    env_file:
      - .env
    environment:
      # On SIGTERM, keep answering while readiness reports 503 for six seconds, then
      # close the socket - `Readiness` implements `OnBeforeShutdown`, which runs before
      # `server.stop()`. Nothing here polls readiness to decide routing, so the value
      # is modest; it is set at all because a shape only configured in production is a
      # shape nobody has run.
      HEALTH_DRAIN_DELAY_MS: 6000

      # Everything below is a fact about *this container*, not about the deployment,
      # which is why it is here rather than in `.env`. `environment:` outranks
      # `env_file:`, and that precedence is the whole mechanism: a root `.env` that
      # also carries the app's own configuration - the 3999 the Vite proxy wants, a
      # `localhost` Redis, a `./data` relative path - cannot reach in here and
      # quietly break the container.
      APP_ENV: prod
      NODE_ENV: production
      # The port this file publishes. An `API_PORT` in `.env` used to win, so the
      # app listened on 3999 while the mapping pointed at 3001 and nothing answered.
      API_PORT: 3001
      # Absolute, and on the volume. A relative `./data/...` resolves against the
      # image WORKDIR (/app/apps/be), which is not the mount - so the database lived
      # in the container layer and every restart began with an empty one.
      SQLITE_DB_PATH: /app/data/firecracker.db
      STORAGE_LOCAL_ROOT: /app/data/uploads
      # The compose service name. There is no Redis in this container, and an absent
      # one does not fail boot - the queue answers 503 - so the symptom is a lobby
      # stuck on "starting", which looks nothing like a misconfiguration. The `:+`
      # keeps the URL right whether or not REDIS_PASSWORD is set.
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}app-redis:6379
      # cloudflared is the only caller. Without this, `ClientAddress.of` ignores
      # `x-forwarded-for` and falls back to the peer address - the tunnel's own
      # container - so every visitor on earth shares one THROTTLE_LIMIT bucket.
      TRUST_PROXY: 'true'
    # The drain plus teardown. Explicit next to the number it depends on, because
    # Docker's 10s default would not survive raising it.
    stop_grace_period: 20s
    ports:
      - '${COMPOSE_API_PORT:-3001}:3001'
    volumes:
      - app-data:/app/data
    depends_on:
      app-redis:
        condition: service_healthy
    networks:
      - app

volumes:
  redis-data:
  app-data:

networks:
  app:
    name: app-network
    driver: bridge
