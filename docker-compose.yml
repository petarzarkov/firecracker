# Development. Redis and nothing else.
#
# The database is a SQLite file under `apps/be/data/`, opened directly by the web
# process and the worker - there is no container for it and nothing to wait for.
# Postgres left with the TypeORM migration.
#
# Redis is not optional the way a cache is: BullMQ drives every round transition,
# the crash engine takes its commands over pub/sub, and the WebSocket relay fans
# ticks across processes. With Redis down the app boots and serves, but no round
# ever advances.
#
# The app itself is not here on purpose - `bun dev` and `bun run worker` are what
# you want in development. See docker-compose.prod.yml for the deployed shape.
services:
  app-redis:
    image: public.ecr.aws/docker/library/redis:8.4.0
    container_name: app-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: >
      sh -c "
      if [ -n \"$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $REDIS_PASSWORD
      else
        redis-server
      fi
      "
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a $REDIS_PASSWORD ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
